name: CI

# The Linux build is the whole point of this file. Every Linux-only line in
# this repo lives behind a `#[cfg]` that a Windows build never type-checks, so
# without a Linux job the platform rots silently — which is exactly what
# happened (see REVIEW.md, B2).

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  core:
    # core, cli and helper carry all the platform-specific code and have no
    # system dependencies, so they build anywhere Rust does.
    name: core / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --all --check

      - name: Test
        run: cargo test -p laninv-core -p laninv -p laninv-helper --all-targets

      - name: Clippy
        run: cargo clippy -p laninv-core -p laninv -p laninv-helper --all-targets

  gui:
    # Separate job: Tauri needs system libraries and a built frontend, and a
    # failure here should be distinguishable from a core failure.
    name: gui / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tauri system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file

      - name: Build the frontend
        run: npm ci && npm run build
        working-directory: ui

      - name: Build the GUI
        run: cargo build -p laninv-gui
