name: CI

# The Linux build is the whole point of this file. Every Linux-only line in
# this repo lives behind a `#[cfg]` that a Windows build never type-checks, so
# without a Linux job the platform rots silently — which is exactly what
# happened (see REVIEW.md, B2).

on:
  # `pull_request` already covers a branch on its way in. Without this
  # filter a push to a PR branch fires both events and runs every job twice.
  # Use the manual trigger for a branch that has no PR yet.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes the older run's remaining jobs pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  core:
    # core, cli and helper carry all the platform-specific code and have no
    # system dependencies, so they build anywhere Rust does.
    name: core / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Keyed on the lockfile and toolchain, so it only rebuilds what changed.
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Test
        run: cargo test -p laninv-core -p laninv -p laninv-helper --all-targets

      - name: Clippy
        run: cargo clippy -p laninv-core -p laninv -p laninv-helper --all-targets

  gui:
    # Separate job: Tauri needs system libraries and a built frontend, and a
    # failure here should be distinguishable from a core failure.
    name: gui / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Worth far more here than in `core`: without it every run recompiles
      # the whole GTK/WebKit dependency tree.
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tauri system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file

      - name: Build the frontend
        run: npm ci && npm run build
        working-directory: ui

      # `custom-protocol` is what makes this the binary you would actually
      # ship. Without it tauri builds the dev variant, which loads `devUrl`
      # and cannot run on its own -- so this job used to pass on something
      # nobody could launch.
      - name: Build the GUI
        run: cargo build -p laninv-gui --features laninv-gui/custom-protocol
