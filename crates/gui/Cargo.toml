[package]
name = "laninv-gui"
description = "LAN inventory GUI (Tauri 2)"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
laninv-core = { path = "../core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
# Required for any build meant to run on its own.
#
# Tauri decides dev-vs-production from this feature, not from the cargo
# profile: its build script does `let dev = !custom_protocol`. Without it
# even `cargo build --release` produces a binary that loads `devUrl` and
# shows "localhost refused to connect" unless a Vite dev server happens to
# be running. See README, "Building a runnable app".
custom-protocol = ["tauri/custom-protocol"]
