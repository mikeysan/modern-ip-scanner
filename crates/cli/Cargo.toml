[package]
name = "laninv"
description = "LAN inventory CLI (headless)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "laninv"
path = "src/main.rs"

[dependencies]
laninv-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
