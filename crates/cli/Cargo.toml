[package]
name = "modern-ip-scanner"
description = "Modern IP Scanner CLI (headless)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mipscan"
path = "src/main.rs"

[dependencies]
modern-ip-scanner-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
